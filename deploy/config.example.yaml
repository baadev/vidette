# Vidette configuration: annotated example (v0.2, intent layer over Frigate).
#
# This file is executable documentation: a test in server/tests/test_config.py keeps it valid
# against the schema, so it can never drift from the code. Reference: docs/configuration.md.
#
# Conventions:
#   - secrets are ${ENV_VAR} references, never literals (unset vars fail validation, loudly)
#   - camera names are Frigate's camera keys (back_yard), not their friendly_name
#
# Validate any time:  vidette validate /config/vidette.yaml

server:
  port: 8642
  # base_url: https://vidette.example.com   # used in notification links
  auth:
    mode: builtin          # first run forces admin creation; no default credentials, ever

storage:
  media_dir: /media/vidette   # snapshots cached from Frigate for Vidette's events; no recordings
  database: /config/vidette.db

# Where incidents come from (docs/frigate.md). Vidette opens no camera connection itself.
frigate:
  url: http://frigate:5000    # Frigate's internal API port on the compose network
  mqtt:                       # the broker Frigate publishes to (Frigate's own `mqtt:` section)
    host: mqtt
    port: 1883
    username: vidette
    password: ${FRIGATE_MQTT_PASSWORD}
    topic_prefix: frigate     # Frigate's mqtt.topic_prefix
  cameras: all                # or a list of Frigate camera keys: [front_door, back_yard]
  severities: [alert, detection]
  tracked_objects: true       # also read <prefix>/events (zones, stationary, scores per object)

# Or (and): folders of finished clips, for cameras Frigate cannot use, such as a battery
# camera collected with `vidette collect` (docs/clip-folders.md, ADR-0010).
# clip_folders:
#   - path: /clips/front-door   # mount it read-only into the container
#     camera: front_door        # used when a clip has no vidette-collect sidecar
#     poll_every: 10s
#     settle: 5s                # unchanged this long before it is read (uploads)

understanding:
  vlm:                     # the VLM judge (docs/vlm.md); one OpenAI-compatible client
    backend: none          # none | local | cloud; the System page can switch it
    frames_per_call: 4
    local:                 # Ollama by default: frames never leave your network
      base_url: http://localhost:11434/v1   # in Docker: http://host.docker.internal:11434/v1
      model: qwen2.5vl:7b
    # cloud:               # opt-in: choosing it sends camera frames to the vendor
    #   preset: openai     # openai | gemini | openrouter | custom (+ base_url)
    #   model: gpt-4.1-mini
    #   api_key: ${OPENAI_API_KEY}
    #   max_calls_per_day: 200
    #   prices: {usd_per_mtok_in: 0, usd_per_mtok_out: 0}   # yours, for cost reports

policies:
  # Plain language. Stored today, judged from week 2 of the v0.2 plan; measure a policy
  # offline first with `vidette eval` (docs/eval.md).
  - name: entry-interest
    description: >
      Alert when a person shows interest in getting in: tries the door handle, lingers at
      the door or windows, peers inside. Ignore people passing by on the street, couriers
      dropping off a parcel, cats and car headlights.
    cameras: all
    sensitivity: balanced  # relaxed | balanced | paranoid
    actions: [notify]
    known_people: judge    # judge | quiet: known people never need an alert (docs/people.md)

# people:                  # known people: local face recognition, opt-in (docs/people.md)
#   enabled: true          # needs `pip install 'vidette[people]'` and `vidette people models`
#   dir: /config/people    # biometric data: outside any git repository, owner-only
#   threshold: 0.4
#   min_face_px: 40

notifications:
  channels:
    push:
      kind: webpush        # PWA push, no vendor cloud between camera and phone
    telegram:
      kind: apprise        # one Apprise URL = Telegram/Discord/Slack/ntfy/… (100+ services)
      url: "tgram://${TG_BOT_TOKEN}/${TG_CHAT_ID}"
    hooks:
      kind: webhook        # signed: X-Vidette-Signature (docs/events-and-automations.md)
      url: https://automation.example.com/vidette
      secret: ${VIDETTE_WEBHOOK_SECRET}
      include: [summary, snapshot_url, clip_url]
  rules:
    - when: event.confirmed  # nothing is confirmed until verdicts land (v0.2, week 2)
      channels: [push, telegram, hooks]
    - when: system.*         # Frigate unreachable, broker down: it snitches on itself
      channels: [hooks]

integrations:
  mqtt:                    # Vidette's own outbound MQTT (verdict events, HA discovery)
    enabled: false
    # host: mqtt
    # username: vidette
    # password: ${MQTT_PASSWORD}

telemetry:
  enabled: false           # default forever; the key exists so the promise is visible
