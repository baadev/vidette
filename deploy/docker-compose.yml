# Vidette v0.2 (development line): one service beside an existing Frigate + MQTT broker.
#
#   docker compose -f deploy/docker-compose.yml up -d --build   →  http://localhost:8642
#
# Vidette needs to reach Frigate's API (frigate.url, usually port 5000) and the MQTT broker
# Frigate publishes to. The easiest way is to add this service to the compose project that
# already runs Frigate; docs/frigate.md shows that and the separate-project variant.
#
# Published images (ghcr.io/baadev/vidette) are still the v0.1.x NVR line; this file always
# builds from your checkout so you get what you read.

name: vidette

services:
  vidette:
    image: vidette:dev
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8642:8642"
    volumes:
      - vidette-config:/config          # DB (writable, uid 1000); put vidette.yaml here
      - vidette-media:/media/vidette    # snapshots cached from Frigate
      # Manage the config as a file instead: put vidette.yaml in ./config next to this
      # compose file, then on Linux: chown 1000:1000 ./config
      # - ./config:/config
    environment:
      - TZ=${TZ:-UTC}
      # Secrets referenced from config as ${VAR} live here or in a .env file beside this
      # compose file (see .env.example):
      # - FRIGATE_MQTT_PASSWORD=
      # - VIDETTE_WEBHOOK_SECRET=
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8642/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vidette-config:
  vidette-media:
