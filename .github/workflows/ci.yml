name: CI

on:
  push:
    branches: [main, v0.2]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tags since v8; pin the full version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install (exactly what uv.lock pins, with the known-people extra)
        run: uv sync --locked --dev --extra people
      # The collector, label and VLM-judge tests drive the real ffmpeg (against a fake
      # RTSP camera); without it they skip instead of testing anything.
      - name: ffmpeg for the media tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Lint (ruff)
        run: uv run --locked ruff check .
      - name: Types (mypy strict)
        run: uv run --locked mypy vidette
      - name: Tests
        run: uv run --locked pytest -q
      - name: Example config validates
        run: |
          FRIGATE_MQTT_PASSWORD=x VIDETTE_WEBHOOK_SECRET=x TG_BOT_TOKEN=x TG_CHAT_ID=x \
            uv run --locked vidette validate ../deploy/config.example.yaml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install (exactly what package-lock.json pins)
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  privacy:
    # A public repository: no credentials, no real addresses, no faces or footage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks reads the whole history
      - name: Privacy check (credentials in URLs, private addresses, media, e-mails)
        run: python3 .github/scripts/privacy_check.py
      - name: gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .
