name: Release

# Publishes a multi-arch container image to GHCR and cuts a GitHub Release when a
# v* tag is pushed. Trigger:  git tag v0.2.0 && git push origin v0.2.0
#
# Which tags move (decided by .github/scripts/release-channel.sh, tested in
# server/tests/test_release_channel.py):
#   v0.2.0-rc.1  → image 0.2.0-rc.1 only; GitHub pre-release; `latest` stays where it is
#   v0.2.0       → images 0.2.0, 0.2 and `latest`; GitHub "Latest release"
#   v0.1.4 after v0.2.0 → images 0.1.4 and 0.1; `latest` stays on the newer line
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
      latest: ${{ steps.channel.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every tag: `latest` only moves to the highest stable one

      - name: Release channel (pre-release? moves latest?)
        id: channel
        run: .github/scripts/release-channel.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is decided above, never by the action's own rules.
          flavor: |
            latest=false
          # A pre-release tag yields only its exact version: metadata-action does not
          # extend {{major}}.{{minor}} for pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.latest }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: .github/RELEASE_TEMPLATE.md
          append_body: true
          prerelease: ${{ needs.image.outputs.prerelease }}
          make_latest: ${{ needs.image.outputs.latest }}
